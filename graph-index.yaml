  coordination-cost-decides-the-shape-of-the-firm:
    title: "Firms exist where coordinating inside is cheaper than coordinating through a market — so whatever cuts coordination cost redraws the firm"
    description: "Coase's 1937 answer to why firms exist is transaction costs, but firms carry their own coordination costs (management, meetings, reporting); Amjad Masad argues agents now absorb execution and coordination, so the organization itself is up for redesign"
    topics: [economics, future-of-ai-business]
    source: "@amasad (Amjad Masad) — The Rise of the Self-Driving Company"
    source_file: sources/amasad-rise-of-the-self-driving-company.md

  most-people-still-carry-a-pre-agentic-cost-model:
    title: "Most people still carry a pre-agentic cost model — re-price the problems you stopped trying to fix"
    description: "Dan Luu argues that the slow builds and missing tools people complain about daily are now cheap to fix; not attempting them is an old cost estimate, and doing exactly the work of five years ago with AI buys little because of Amdahl's law"
    topics: [future-of-ai-business, decision-making]
    source: "Dan Luu — We should be more ambitious with the software we build (shared by @dabit3)"
    source_file: sources/danluu-we-should-be-more-ambitious.md
    domain: ai
    kind: thinking-tool
    outgoing: [amplification-widens-the-judgment-gap, software-abundance-unlocks-categories-that-never-existed, stronger-models-expand-the-verification-gap]

  cross-check-inconsistent-sources-to-converge-on-a-spec:
    title: "When every written source is inconsistent, cross-check them against each other to converge on a spec"
    description: "Dan Luu got a near-correct rule set for a board game whose official rules contradict themselves by running consistency checks across all the inconsistent explanations — costlier in tokens than a manual approach, cheaper than his own time writing a clean spec"
    topics: [ai-agents, knowledge-systems]
    source: "Dan Luu — We should be more ambitious with the software we build (shared by @dabit3)"
    source_file: sources/danluu-we-should-be-more-ambitious.md
    domain: ai
    kind: practice
    outgoing: [conflicting-context-causes-agent-collapse-not-graceful-degradation, derive-the-manual-from-observed-practice-not-written-procedure, resolve-ambiguity-before-passing-it-downstream]

  types-are-the-fastest-feedback-an-agent-gets:
    title: "Types are the fastest feedback an agent gets — make illegal states unrepresentable and a mistake becomes impossible everywhere"
    description: "Ron Minsky (Jane Street) argues agents thrive on feedback, and a type checker answers faster than any test suite and never forgets an invariant the way a long context does; shaping data so the wrong combination cannot be written enforces a rule across the whole codebase"
    topics: [ai-coding-tools, engineering]
    source: "Ron Minsky (Jane Street) — Now more than ever: building reliable software in the age of agents (talk, shared by @poteto)"
    source_file: sources/yminsky-reliable-software-in-the-age-of-agents.md
